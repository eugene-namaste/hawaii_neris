  <body>
    <calcite-shell>
      <!-- ── Left: manual workflow (no AI needed) ─────────────────────────── -->
      <calcite-shell-panel slot="panel-start" width="m" id="search-panel">
        <calcite-panel heading="Proximity search" id="search-panel-inner" description="Signing in…">
          <calcite-block heading="1. Location" description="Click the map or find an address" expanded>
            <div class="row">
              <calcite-input id="address-input" placeholder="Address or place" icon="search" clearable></calcite-input>
              <calcite-button id="address-btn" appearance="outline">Find</calcite-button>
            </div>
            <calcite-list id="candidate-list" label="Address matches" selection-mode="none" hidden></calcite-list>
            <calcite-label layout="inline" class="switch-label">
              <calcite-switch id="pick-switch" checked></calcite-switch>
              Set location by clicking the map
            </calcite-label>
            <div id="location-text" class="muted">No location yet.</div>
          </calcite-block>

          <calcite-block heading="2. Search area" description="Buffer, drive time or drive distance" expanded>
            <calcite-segmented-control id="method" width="full" label="Search area method">
              <calcite-segmented-control-item value="buffer" checked>Buffer</calcite-segmented-control-item>
              <calcite-segmented-control-item value="driveTime" class="drive-method">Drive time</calcite-segmented-control-item>
              <calcite-segmented-control-item value="driveDistance" class="drive-method">Drive distance</calcite-segmented-control-item>
              <calcite-segmented-control-item value="boundary" id="boundary-method" hidden>Boundary</calcite-segmented-control-item>
            </calcite-segmented-control>
            <div class="row" id="value-row">
              <calcite-input-number id="value-input" value="1" min="0" step="any" label="Distance or time"></calcite-input-number>
              <calcite-select id="unit-select" label="Unit"></calcite-select>
            </div>
            <div id="boundary-row" hidden>
              <calcite-select id="boundary-layer-select" label="Boundary layer"></calcite-select>
              <calcite-select id="boundary-name-select" label="Boundary"></calcite-select>
            </div>
            <calcite-button id="area-btn" width="full" icon-start="polygon">Create search area</calcite-button>
            <div id="area-text" class="muted"></div>
          </calcite-block>

          <calcite-block heading="3. Intersecting features" expanded>
            <calcite-label>
              Optional attribute filter (SQL)
              <calcite-input id="where-input" placeholder="e.g. LAND_USE = 'Vacant'" clearable></calcite-input>
            </calcite-label>
            <calcite-button id="search-btn" width="full" icon-start="search">Find features in area</calcite-button>
            <div id="results"></div>
          </calcite-block>

          <calcite-notice id="notice" kind="danger" icon closable hidden>
            <div slot="message" id="notice-text"></div>
          </calcite-notice>

          <calcite-button slot="footer" id="clear-btn" appearance="outline" kind="neutral" width="half">Clear</calcite-button>
          <calcite-button slot="footer" id="csv-btn" appearance="outline" width="half" icon-start="download" disabled>
            CSV
          </calcite-button>
        </calcite-panel>
      </calcite-shell-panel>

      <!-- ── Map ──────────────────────────────────────────────────────────── -->
      <arcgis-map id="main-map">
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <arcgis-home slot="top-left"></arcgis-home>
        <arcgis-expand slot="top-right" expand-tooltip="Layers">
          <arcgis-layer-list></arcgis-layer-list>
        </arcgis-expand>
        <arcgis-scale-bar slot="bottom-left" bar-style="ruler" unit="imperial"></arcgis-scale-bar>
        <calcite-loader id="map-loader" slot="top-right" scale="s" inline hidden label="Working"></calcite-loader>
      </arcgis-map>

      <!-- ── Right: AI assistant (beta) ───────────────────────────────────── -->
      <calcite-shell-panel slot="panel-end" width="l" id="assistant-panel" resizable>
        <calcite-panel>
          <arcgis-assistant
            id="assistant"
            reference-element="#main-map"
            heading="Proximity assistant"
            description="Ask in plain language: find an address, draw a buffer or drive-time area, and list the features inside it."
            entry-message="Try: “Find parcels within a 10-minute drive of 150 NE 2nd Ave” — or click the map first and say “buffer this by half a mile and search”."
            log-enabled
            keep-suggested-prompts
          >
            <arcgis-assistant-navigation-agent></arcgis-assistant-navigation-agent>
          </arcgis-assistant>
        </calcite-panel>
      </calcite-shell-panel>
    </calcite-shell>

  </body>
